# KaraVan APK'sini GitHub sunucularinda derler (her yuklemede ve elle "Run workflow").
# Proje depoda KaraVanApp.zip olarak durur; derlemede acilir.
# Sonuc: Releases > KaraVan.apk, "apk" dali, "derleme-kaydi" dali (hata ayiklama).
name: KaraVan APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: APK derle
        run: |
          set -o pipefail
          unzip -q -o KaraVanApp.zip -d kaynak
          cd kaynak/KaraVanApp
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          mkdir -p "$GITHUB_WORKSPACE/cikti"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/cikti/KaraVan.apk"

      - name: Derleme kaydi
        if: always()
        run: |
          mkdir -p /tmp/kayit
          { echo "durum: ${{ job.status }} calisma: ${{ github.run_number }}"; tail -n 300 build.log 2>/dev/null || echo "build.log yok"; } > /tmp/kayit/derleme.log
          cd /tmp/kayit && git init -q -b derleme-kaydi
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derleme.log && git commit -q -m "Derleme kaydi ${{ github.run_number }}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" derleme-kaydi

      - name: APK dalina koy
        run: |
          mkdir -p /tmp/apk && cp cikti/KaraVan.apk /tmp/apk/ && cd /tmp/apk && git init -q -b apk
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KaraVan.apk && git commit -q -m "KaraVan.apk ${{ github.run_number }}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: KaraVan v1.0.${{ github.run_number }}
          body: Telefona indirip dosyaya dokunarak kurun.
          files: cikti/KaraVan.apk
